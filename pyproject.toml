[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ethiopian-financial-news-aggregation"
version = "1.0.0"
description = "Financial News Aggregation System for Ethiopian Markets"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "motor>=3.3.2",
    "beanie>=1.23.6",
    "httpx>=0.25.2",
    "beautifulsoup4>=4.12.2",
    "lxml>=4.9.3",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
    "flashtext>=2.7.1",
    "apscheduler>=3.10.4",
    "loguru>=0.7.2",
    "pydantic>=2.5.2",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.2",
]

[tool.setuptools]
packages = ["src"]

