# Runs the harvest on GitHub's free scheduler (no server, no card needed).
name: Harvest

on:
  schedule:
    # Every 10 minutes, around the clock, weekends included - the same cadence the Lambda had.
    # Offset minutes (not :00/:10) because GitHub delays runs queued at the top of the hour.
    - cron: "3,13,23,33,43,53 * * * *"   # ESX prices
    - cron: "8,18,28,38,48,58 * * * *"   # news
  workflow_dispatch:
    inputs:
      task:
        description: Which task to run
        type: choice
        options: [news, market_prices]
        default: news

# Never run the same task twice at once (prices and news may overlap each other).
concurrency:
  group: harvest-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run task
        env:
          TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || (github.event.schedule == '8,18,28,38,48,58 * * * *' && 'news' || 'market_prices') }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          CORE_SERVICE_URL: ${{ secrets.CORE_SERVICE_URL }}   # e.g. https://stocet-core-service.onrender.com/api/v1
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: python -m src.run_task "$TASK"
