# Runs one harvest task on a free GitHub runner (no server, no card needed).
name: Harvest

on:
  # Triggered every 10 minutes by cron-job.org (POST to the GitHub API), which is far more punctual than
  # GitHub's own `schedule`. Both tasks: market_prices and news. Can also be started by hand from the Actions tab.
  workflow_dispatch:
    inputs:
      task:
        description: Which task to run
        type: choice
        options: [news, market_prices]
        default: news

# Never run the same task twice at once (prices and news may overlap each other).
concurrency:
  group: harvest-${{ inputs.task }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run task
        env:
          TASK: ${{ inputs.task }}
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          CORE_SERVICE_URL: ${{ secrets.CORE_SERVICE_URL }}   # e.g. https://stocet-core-service.onrender.com/api/v1
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: python -m src.run_task "$TASK"
