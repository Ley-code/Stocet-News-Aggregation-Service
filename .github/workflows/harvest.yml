# Runs the harvest on GitHub's free scheduler instead of AWS Lambda (no server, no card needed).
name: Harvest

on:
  schedule:
    - cron: "5 */2 * * *"        # news, every 2 hours
    - cron: "*/30 6-12 * * 1-5"  # ESX prices, every 30 min during trading hours (UTC), weekdays
  workflow_dispatch:
    inputs:
      task:
        description: Which task to run
        type: choice
        options: [news, market_prices]
        default: news

# Never run two harvests at once.
concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run task
        env:
          TASK: ${{ github.event_name == 'workflow_dispatch' && inputs.task || (github.event.schedule == '5 */2 * * *' && 'news' || 'market_prices') }}
          # Makes the app run once and exit instead of starting its own scheduler.
          AWS_LAMBDA_FUNCTION_NAME: github-actions
          POSTGRES_DSN: ${{ secrets.POSTGRES_DSN }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME }}
          CORE_SERVICE_URL: ${{ secrets.CORE_SERVICE_URL }}   # e.g. https://stocet-core-service.onrender.com/api/v1
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
        run: |
          python - <<'PY'
          import json, os
          import lambda_function as lf
          out = lf.lambda_handler({"task": os.environ["TASK"]}, None)
          print(json.dumps(out, default=str)[:3000])
          PY
